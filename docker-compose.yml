services:
  comfyui:
    build:
      context: .
      args:
        COMFYUI_VERSION: ${COMFYUI_VERSION:-master}
    image: local-comfy-ui:latest
    container_name: comfyui
    restart: unless-stopped
    # 生成物がホスト側で自分の所有になるよう uid/gid を合わせる
    user: "${COMFYUI_UID:-1000}:${COMFYUI_GID:-1000}"
    # 既定はループバックのみ。Manager の network_mode = personal_cloud により
    # ネットワーク越しのカスタムノード導入が可能になるため、公開範囲を絞る
    ports:
      - "${COMFYUI_BIND:-127.0.0.1}:${COMFYUI_PORT:-8188}:8188"
    volumes:
      - ./data/models:/opt/comfyui/models
      - ./data/input:/opt/comfyui/input
      - ./data/output:/opt/comfyui/output
      - ./data/user:/opt/comfyui/user
      - ./data/custom_nodes:/opt/comfyui/custom_nodes
      # リポジトリで管理している自作のカスタムノード。data/custom_nodes は
      # ComfyUI-Manager の管理領域で .gitignore してあるため、こちらは別に重ねる
      - ./custom_nodes/danbooru_tag_composer:/opt/comfyui/custom_nodes/danbooru_tag_composer
      # HF キャッシュ (~/.cache) と pip install --user の追加パッケージ (~/.local)
      - comfy-home:/home/comfyui
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      COMFYUI_ENABLE_MANAGER: ${COMFYUI_ENABLE_MANAGER:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats')"
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  comfy-home:
